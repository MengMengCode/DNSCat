name: Docker

# 构建多架构容器镜像并推送到 GHCR。
#
# 产出两个镜像（主控与边缘节点是两个独立进程，镜像内容差别很大，
# 合成一个再用参数分流会让边缘镜像白白背上前端资源与数据库驱动）：
#   ghcr.io/<owner>/dnscat-server
#   ghcr.io/<owner>/dnscat-node
#
# tag 策略：
#   v1.2.3 → 1.2.3, 1.2, latest
#   master → edge
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的已有 tag（留空则构建当前默认分支）'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dnscat-server
            dockerfile: deploy/Dockerfile.server
          - image: dnscat-node
            dockerfile: deploy/Dockerfile.node

    steps:
      - uses: actions/checkout@v4
        with:
          # 手动指定 tag 时检出该 tag，否则用触发本次运行的 ref
          ref: ${{ inputs.tag || github.ref }}

      # 版本号来源与 release.yml 保持一致：tag 触发取 tag 名，分支触发记为 dev。
      # 镜像里的二进制自报版本必须和镜像 tag 一致，否则排查线上问题时会互相矛盾。
      - name: Resolve version
        id: ver
        run: |
          set -eu
          TAG='${{ inputs.tag }}'
          if [ -z "${TAG}" ] && [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "${TAG}" ]; then
            TAG="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Version: ${TAG}"

      # GHCR 的仓库路径必须全小写，而 GitHub 用户名可以带大写字母。
      # 直接用 ${{ github.repository_owner }} 拼会在推送时报 invalid reference format。
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.description=DNSCat authoritative DNS with smart Anycast routing

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # armv7 不在列：Dockerfile 基于 alpine，而 node:20-alpine 没有 armv7 变体，
          # 前端构建阶段会直接失败。需要 armv7 的用二进制安装。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
