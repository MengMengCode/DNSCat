name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 默认构建（不带 embedui）必须在没有 web/dist 的全新克隆上通过，
      # 否则贡献者一上手就编译不过。
      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  embed:
    name: Verify embedui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      # 校验发布用的嵌入式构建可用：控制台资源打进二进制后，
      # 服务不再依赖运行时的工作目录。
      - name: Build server with embedded console
        run: |
          set -eux
          rm -rf internal/webui/dist
          cp -r web/dist internal/webui/dist
          go build -tags embedui -o /tmp/dnscat-server ./cmd/server
          ls -l /tmp/dnscat-server

  scripts:
    name: Shell script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n deploy/install.sh

      - name: Reject CRLF and BOM in shell scripts
        run: |
          set -eu
          fail=0
          for f in $(git ls-files '*.sh'); do
            if head -c 3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "::error file=$f::UTF-8 BOM found; it breaks the shebang"
              fail=1
            fi
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::CRLF line endings found; they break execution on Linux"
              fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # 仅拦截 error 级问题；风格类提示不阻塞。
          shellcheck -S error deploy/install.sh

  compose:
    name: Compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用占位密钥校验 compose 文件本身可解析。
      # 这些文件对密钥使用 ${VAR:?} 语法，缺变量会直接失败，正是预期行为。
      - name: Validate compose files
        run: |
          set -eux
          cd deploy
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-placeholder
          JWT_SECRET=ci-placeholder
          CLUSTER_TOKEN=ci-placeholder
          MASTER_URL=http://192.0.2.1:8080
          NODE_ID=ci-node
          NODE_PUBLIC_IP=192.0.2.2
          EOF
          docker compose -f docker-compose.master.yml config >/dev/null
          docker compose -f docker-compose.node.yml config >/dev/null
          rm -f .env
          echo "compose files OK"
