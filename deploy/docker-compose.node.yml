# DnsCat 被控（边缘）节点部署：只跑 node 子程序，回连主控同步权威区域。
#
# 本机不需要数据库、Redis 与 Web 控制台——一个进程即可对外提供权威应答。
#
# ── 容错（当前实际行为）──────────────────────────────────────────────────
#   · 启动后每 10s 从主控同步一次区域，每 3s 上报一次心跳；
#   · 同步失败只记日志、不退出，继续用内存中已缓存的区域应答，主控恢复后自动续传；
#   · 注意：区域快照目前只在内存里，节点进程重启后需要主控可达才能重新载入。
#     若主控与本节点同时重启，本节点在主控就绪前无法应答。
#
# ── 用法 ────────────────────────────────────────────────────────────────
#   1) 放开防火墙 UDP/TCP 53。
#   2) 在本目录准备 .env（deploy/install.sh --mode docker --role node 会自动生成）：
#        MASTER_URL=http://<主控公网IP>:8080
#        NODE_ID=edge-fra-01              # 集群内唯一
#        CLUSTER_TOKEN=<与主控 .env 里完全一致>
#        NODE_PUBLIC_IP=<本机对外公网 IP>
#   3) docker compose -f deploy/docker-compose.node.yml up -d --build
#
# NODE_PUBLIC_IP 必须显式声明：节点经 NAT/网桥回连主控时源地址是内网 IP，
# 不声明的话节点列表与 Glue 记录里会出现错误的地址。

services:
  node:
    # 默认拉取 CI 发布的多架构镜像（GHCR），目标机无需编译。
    # 同时保留 build 段：加 --build 就地构建，用于改了源码想验证的场合。
    image: ${DNSCAT_NODE_IMAGE:-ghcr.io/mengmengcode/dnscat-node:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    container_name: dnscat-node
    restart: always
    cap_add:
      - NET_RAW
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      # 令牌走环境变量而非命令行：命令行参数会出现在容器内的 ps 输出与
      # `docker inspect` 结果里，而 inspect 对能访问 docker socket 的用户都可读。
      - DNSCAT_CLUSTER_TOKEN=${CLUSTER_TOKEN:?请在 deploy/.env 中设置 CLUSTER_TOKEN（须与主控一致）}
    command:
      - "--master"
      - "${MASTER_URL:?请在 deploy/.env 中设置 MASTER_URL，例如 http://203.0.113.10:8080}"
      - "--node-id"
      - "${NODE_ID:?请在 deploy/.env 中设置 NODE_ID（集群内唯一）}"
      - "--public-ip"
      - "${NODE_PUBLIC_IP:?请在 deploy/.env 中设置 NODE_PUBLIC_IP（本机对外公网 IP）}"
      - "--udp"
      - "53"
      - "--tcp"
      - "53"
    networks:
      - dnscat_net

networks:
  dnscat_net:
    driver: bridge
